# Increase the memory available to Gradle.
org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true

# IntelliJ IDEA is not yet fully compatible with Loom + configuration cache.
# See https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Fabric properties - check these on https://fabricmc.net/develop
# Minecraft 26.2 requires Java 25 and uses official Mojang mappings
# (Yarn was discontinued after 1.21.11, so there is no `mappings` dependency).
minecraft_version=26.2
loader_version=0.19.3
loom_version=1.17-SNAPSHOT

# Mod properties
mod_version=0.1.0
maven_group=dev.bbbt
archives_base_name=brickbybricktab

# Dependencies
fabric_api_version=0.157.0+26.2
